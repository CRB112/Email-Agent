name: Tests and Linux package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: bash run_tests.sh
      - run: xvfb-run -a python -m unittest tests.test_gui_smoke -v
        env:
          EMAIL_AGENT_GUI_TESTS: '1'
      - run: bash build_linux.sh
      - run: dist/EmailSiftingAgent --check-install
      - uses: actions/upload-artifact@v4
        with:
          name: EmailSiftingAgent-linux
          path: dist/EmailSiftingAgent
